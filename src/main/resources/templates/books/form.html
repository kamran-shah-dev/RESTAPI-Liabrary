<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add a Book</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 480px;
            margin: 40px auto;
            color: #222;
        }
        h1 {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 8px 16px;
        }
        .message {
            padding: 10px;
            background-color: #e6f4ea;
            color: #1e7e34;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Add a Book</h1>

    <p class="message" th:if="${message}" th:text="${message}"></p>

    <form th:action="@{/books/new}" th:object="${book}" method="post">
        <label for="title">Title</label>
        <input type="text" id="title" th:field="*{title}" required>

        <label for="author">Author</label>
        <input type="text" id="author" th:field="*{author}" required>

        <label for="publicationYear">Publication Year</label>
        <input type="number" id="publicationYear" th:field="*{publicationYear}" required>

        <label for="genre">Genre</label>
        <input type="text" id="genre" th:field="*{genre}" required>

        <label for="availableCopies">Available Copies</label>
        <input type="number" id="availableCopies" th:field="*{availableCopies}" min="0" required>

        <button type="submit">Add Book</button>
    </form>
</body>
</html>
