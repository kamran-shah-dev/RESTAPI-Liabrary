<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add a Book</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 480px;
            margin: 40px auto;
            color: #222;
        }
        h1 {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 8px 16px;
        }
        .message {
            padding: 10px;
            background-color: #e6f4ea;
            color: #1e7e34;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Add a Member</h1>

    <p class="message" th:if="${message}" th:text="${message}"></p>

    <form th:action="@{/member/new}" th:object="${member}" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" required>

        <label for="email">Email</label>
        <input type="text" id="email" th:field="*{email}" required>

        <label for="phoneNumber">Phone Number</label>
        <input type="number" id="phoneNumber" th:field="*{phoneNumber}" required>

        <label for="startDate">Start Date</label>
        <input type="date" id="startDate" th:field="*{startDate}" required>

        <label for="endDate">End Date</label>
        <input type="date" id="endDate" th:field="*{endDate}" required>

        <button type="submit">Add Member</button>
    </form>
</body>
</html>
